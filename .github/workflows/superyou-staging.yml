name: SuperYou staging

on:
  workflow_dispatch:
  push:
    branches:
      - autoresearch/plivo-playback-proof
    paths:
      - ".github/workflows/superyou-staging.yml"
      - "ai_agents/agents/examples/voice-assistant-sip-plivo/**"
      - "ai_agents/agents/ten_packages/extension/streamid_adapter/**"
      - "ai_agents/agents/ten_packages/extension/elevenlabs_tts2_python/**"

concurrency:
  group: superyou-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DIR: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
      IMAGE_NAME: superyou-voice-agent-staging
      D1_NAME: superyou-demo-staging
      VECTORIZE_NAME: superyou-kb-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare/package-lock.json

      - name: Install Worker dependencies
        run: npm --prefix "$CF_DIR" ci

      - name: Validate source
        run: |
          python3 -m py_compile \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/call_state.py \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/graph_probe.py \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/persistence.py \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/memory.py \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/server.py \
            ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/extension.py \
            ai_agents/agents/ten_packages/extension/elevenlabs_tts2_python/elevenlabs_tts.py \
            ai_agents/agents/ten_packages/extension/elevenlabs_tts2_python/shutdown.py \
            ai_agents/agents/ten_packages/extension/streamid_adapter/extension.py
          python3 ai_agents/agents/ten_packages/extension/elevenlabs_tts2_python/tests/unit/test_shutdown.py -q
          python3 ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/tests/test_call_state.py -q
          python3 ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/tests/test_graph_probe.py -q
          python3 ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/ten_packages/extension/main_python/tests/test_persistence.py -q
          python3 -m json.tool ai_agents/agents/examples/voice-assistant-sip-plivo/tenapp/property.json >/dev/null
          "$CF_DIR/node_modules/.bin/tsc" --noEmit -p "$CF_DIR/tsconfig.json"

      - name: Verify Cloudflare credentials
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required}"
          "$CF_DIR/node_modules/.bin/wrangler" whoami

      - name: Build container image
        run: |
          docker build \
            --platform linux/amd64 \
            -f ai_agents/agents/examples/voice-assistant-sip-plivo/Dockerfile.cloudflare \
            -t "$IMAGE_NAME:$GITHUB_SHA" \
            ai_agents

      - name: Push image to Cloudflare registry
        run: |
          "$CF_DIR/node_modules/.bin/wrangler" containers push "$IMAGE_NAME:$GITHUB_SHA"
          echo "IMAGE_URI=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_NAME:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Create or locate staging D1 database
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r --arg name "$D1_NAME" '.[] | select((.name // .database_name) == $name) | (.uuid // .id // .database_id)' | head -1)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create "$D1_NAME" --location apac
            database_id="$(npx wrangler d1 list --json | jq -r --arg name "$D1_NAME" '.[] | select((.name // .database_name) == $name) | (.uuid // .id // .database_id)' | head -1)"
          fi
          test -n "$database_id"
          echo "STAGING_D1_ID=$database_id" >> "$GITHUB_ENV"

      - name: Create staging Vectorize index if needed
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: |
          if ! npx wrangler vectorize list --json | jq -e --arg name "$VECTORIZE_NAME" '.[] | select((.name // .index_name) == $name)' >/dev/null; then
            npx wrangler vectorize create "$VECTORIZE_NAME" --dimensions 1024 --metric cosine
          fi

      - name: Generate isolated staging configuration
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: |
          node scripts/generate-staging-config.mjs "$IMAGE_URI" "$STAGING_D1_ID"
          npx wrangler deploy --dry-run --config .generated/wrangler.staging.json

      - name: Apply staging D1 migrations
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: |
          npx wrangler d1 migrations list "$D1_NAME" --remote --config .generated/wrangler.staging.json
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config .generated/wrangler.staging.json

      - name: Seed staging demo data
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: npx wrangler d1 execute "$D1_NAME" --remote --file seed.sql --config .generated/wrangler.staging.json

      - name: Stop previous staging container
        env:
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://superyou-voice-agent-staging.gateway-worker-ai.workers.dev/admin/restart" \
            -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
            | jq -e '.restarted == true'

      - name: Deploy staging Worker and Container
        id: deploy
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        run: |
          npx wrangler deploy --config .generated/wrangler.staging.json 2>&1 | tee .generated/deploy.log
          worker_url="$(grep -Eo 'https://[^ ]+\.workers\.dev' .generated/deploy.log | tail -1)"
          test -n "$worker_url"
          echo "STAGING_URL=$worker_url" >> "$GITHUB_ENV"
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Upload staging secrets
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        env:
          PLIVO_AUTH_ID: ${{ secrets.PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
          PLIVO_FROM_NUMBER: ${{ secrets.PLIVO_FROM_NUMBER }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ELEVENLABS_TTS_KEY: ${{ secrets.ELEVENLABS_TTS_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          HUMAN_AGENT_NUMBER: ${{ secrets.HUMAN_AGENT_NUMBER }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
        run: |
          : "${PLIVO_AUTH_ID:?PLIVO_AUTH_ID secret is required}"
          : "${PLIVO_AUTH_TOKEN:?PLIVO_AUTH_TOKEN secret is required}"
          : "${PLIVO_FROM_NUMBER:?PLIVO_FROM_NUMBER secret is required}"
          : "${SARVAM_API_KEY:?SARVAM_API_KEY secret is required}"
          : "${OPENAI_API_KEY:?OPENAI_API_KEY secret is required}"
          : "${ELEVENLABS_TTS_KEY:?ELEVENLABS_TTS_KEY secret is required}"
          jq -n \
            --arg PLIVO_AUTH_ID "$PLIVO_AUTH_ID" \
            --arg PLIVO_AUTH_TOKEN "$PLIVO_AUTH_TOKEN" \
            --arg PLIVO_FROM_NUMBER "$PLIVO_FROM_NUMBER" \
            --arg PLIVO_PUBLIC_SERVER_URL "$STAGING_URL" \
            --arg DEEPGRAM_API_KEY "$DEEPGRAM_API_KEY" \
            --arg OPENAI_API_KEY "$OPENAI_API_KEY" \
            --arg OPENAI_MODEL "$OPENAI_MODEL" \
            --arg ELEVENLABS_TTS_KEY "$ELEVENLABS_TTS_KEY" \
            --arg ELEVENLABS_VOICE_ID "$ELEVENLABS_VOICE_ID" \
            --arg SARVAM_API_KEY "$SARVAM_API_KEY" \
            --arg MEM0_API_KEY "$MEM0_API_KEY" \
            --arg HUMAN_AGENT_NUMBER "$HUMAN_AGENT_NUMBER" \
            --arg WEATHERAPI_API_KEY "$WEATHERAPI_API_KEY" \
            '{PLIVO_AUTH_ID:$PLIVO_AUTH_ID,PLIVO_AUTH_TOKEN:$PLIVO_AUTH_TOKEN,PLIVO_FROM_NUMBER:$PLIVO_FROM_NUMBER,PLIVO_PUBLIC_SERVER_URL:$PLIVO_PUBLIC_SERVER_URL,DEEPGRAM_API_KEY:$DEEPGRAM_API_KEY,OPENAI_API_KEY:$OPENAI_API_KEY,OPENAI_MODEL:$OPENAI_MODEL,ELEVENLABS_TTS_KEY:$ELEVENLABS_TTS_KEY,ELEVENLABS_VOICE_ID:$ELEVENLABS_VOICE_ID,SARVAM_API_KEY:$SARVAM_API_KEY,MEM0_API_KEY:$MEM0_API_KEY,HUMAN_AGENT_NUMBER:$HUMAN_AGENT_NUMBER,WEATHERAPI_API_KEY:$WEATHERAPI_API_KEY}' \
            > .generated/secrets.json
          npx wrangler secret bulk .generated/secrets.json --config .generated/wrangler.staging.json
          rm -f .generated/secrets.json

      - name: Restart staging container onto the new image
        env:
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$STAGING_URL/admin/restart" \
            -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
            | jq -e '.restarted == true'

      - name: Wait for semantic readiness
        run: |
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 15 "$STAGING_URL/tenapp/readyz"; then
              ready=true
              break
            fi
            echo "waiting for staging readiness ($attempt/40)"
            sleep 5
          done
          test "$ready" = true

      - name: Run staging smoke tests
        env:
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
        run: |
          curl --fail --silent --show-error "$STAGING_URL/health" | jq -e '.status == "healthy"'
          expected_revision="${GITHUB_SHA:0:16}"
          curl --fail --silent --show-error "$STAGING_URL/tenapp/readyz" \
            | jq -e --arg revision "$expected_revision" \
              '.status == "ready" and .deploy_revision == $revision'
          curl --fail --silent --show-error "$STAGING_URL/api/calls" | jq -e '.success == true'
          graph_ready=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 130 \
              -X POST "$STAGING_URL/api/admin/graph-smoke" \
              -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
              | jq -e '.ok == true and .stopped == true and (.graph_id | length > 0)'; then
              graph_ready=true
              break
            fi
            echo "retrying TEN lifecycle smoke ($attempt/3)"
          done
          test "$graph_ready" = true
          curl --fail --silent --show-error --max-time 130 \
            -X POST "$STAGING_URL/api/admin/graph-smoke?full=true" \
            -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
            | jq -e '.ok == true and .stopped == true and .full == true and (.graph_id | length > 0)'
          curl --fail --silent --show-error \
            -X POST "$STAGING_URL/demo/kb/seed" \
            -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
            | jq -e '.ok == true and .upserted > 0'
          curl --fail --silent --show-error \
            "$STAGING_URL/demo/kb/query?q=shipping%20below%20500&top_k=3" \
            | jq -e '.results | length > 0'

          smoke_call="staging-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          payload="$(jq -n --arg call_id "$smoke_call" '{call_id:$call_id,caller:"staging",role:"tool",content:"staging idempotency smoke",sequence:1,source_timestamp_ms:1,turn_id:0,idempotency_key:($call_id + ":1")}')"
          for _ in 1 2; do
            curl --fail --silent --show-error \
              -X POST "$STAGING_URL/demo/transcripts" \
              -H "Content-Type: application/json" \
              -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
              --data "$payload" >/dev/null
          done
          curl --fail --silent --show-error "$STAGING_URL/demo/transcripts?call_id=$smoke_call" \
            | jq -e '.messages | length == 1'

      - name: Publish staging URL
        run: printf '### Staging deployment\n%s\n' "$STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
