name: Build and deploy SuperYou voice agent

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (native amd64, loaded into local docker)
        uses: docker/build-push-action@v6
        with:
          context: ai_agents
          file: ai_agents/agents/examples/voice-assistant-sip-plivo/Dockerfile.cloudflare
          platforms: linux/amd64
          load: true
          tags: superyou-voice-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Cloudflare managed registry
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-fund --no-audit
          npx wrangler containers push superyou-voice-agent:${{ github.sha }}

      - name: Deploy Worker with the new image tag
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i -E "s|(superyou-voice-agent:)[A-Za-z0-9]+|\1${{ github.sha }}|" wrangler.jsonc
          sed -i '/"compatibility_date"/a\  "vars": { "DEPLOY_REVISION": "${{ github.sha }}" },' wrangler.jsonc
          npx wrangler d1 migrations apply superyou-demo --remote
          npx wrangler deploy

      - name: Synchronize production provider secrets
        working-directory: ai_agents/agents/examples/voice-assistant-sip-plivo/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLIVO_AUTH_ID: ${{ secrets.PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
          PLIVO_FROM_NUMBER: ${{ secrets.PLIVO_FROM_NUMBER }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ELEVENLABS_TTS_KEY: ${{ secrets.ELEVENLABS_TTS_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          HUMAN_AGENT_NUMBER: ${{ secrets.HUMAN_AGENT_NUMBER }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
        run: |
          ELEVENLABS_VOICE_ID="${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}"
          OPENAI_MODEL="${OPENAI_MODEL:-gpt-4o-mini}"
          jq -n \
            --arg PLIVO_AUTH_ID "$PLIVO_AUTH_ID" \
            --arg PLIVO_AUTH_TOKEN "$PLIVO_AUTH_TOKEN" \
            --arg PLIVO_FROM_NUMBER "$PLIVO_FROM_NUMBER" \
            --arg PLIVO_PUBLIC_SERVER_URL "https://superyou-voice-agent.gateway-worker-ai.workers.dev" \
            --arg DEEPGRAM_API_KEY "$DEEPGRAM_API_KEY" \
            --arg OPENAI_API_KEY "$OPENAI_API_KEY" \
            --arg OPENAI_MODEL "$OPENAI_MODEL" \
            --arg ELEVENLABS_TTS_KEY "$ELEVENLABS_TTS_KEY" \
            --arg ELEVENLABS_VOICE_ID "$ELEVENLABS_VOICE_ID" \
            --arg SARVAM_API_KEY "$SARVAM_API_KEY" \
            --arg MEM0_API_KEY "$MEM0_API_KEY" \
            --arg HUMAN_AGENT_NUMBER "$HUMAN_AGENT_NUMBER" \
            --arg WEATHERAPI_API_KEY "$WEATHERAPI_API_KEY" \
            '{PLIVO_AUTH_ID:$PLIVO_AUTH_ID,PLIVO_AUTH_TOKEN:$PLIVO_AUTH_TOKEN,PLIVO_FROM_NUMBER:$PLIVO_FROM_NUMBER,PLIVO_PUBLIC_SERVER_URL:$PLIVO_PUBLIC_SERVER_URL,DEEPGRAM_API_KEY:$DEEPGRAM_API_KEY,OPENAI_API_KEY:$OPENAI_API_KEY,OPENAI_MODEL:$OPENAI_MODEL,ELEVENLABS_TTS_KEY:$ELEVENLABS_TTS_KEY,ELEVENLABS_VOICE_ID:$ELEVENLABS_VOICE_ID,SARVAM_API_KEY:$SARVAM_API_KEY,MEM0_API_KEY:$MEM0_API_KEY,HUMAN_AGENT_NUMBER:$HUMAN_AGENT_NUMBER,WEATHERAPI_API_KEY:$WEATHERAPI_API_KEY}' \
            > .production-secrets.json
          trap 'rm -f .production-secrets.json' EXIT
          npx wrangler secret bulk .production-secrets.json

      - name: Restart production container onto the new image
        env:
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://superyou-voice-agent.gateway-worker-ai.workers.dev/admin/restart" \
            -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
            | jq -e '.restarted == true'

      - name: Verify production readiness and full graph
        env:
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
        run: |
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 15 \
              "https://superyou-voice-agent.gateway-worker-ai.workers.dev/tenapp/readyz" \
              | jq -e '.status == "ready"'; then
              ready=true
              break
            fi
            echo "waiting for production readiness ($attempt/40)"
            sleep 5
          done
          test "$ready" = true
          curl --fail --silent --show-error \
            "https://superyou-voice-agent.gateway-worker-ai.workers.dev/health" \
            | jq -e '.status == "healthy"'
          full_graph_ready=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 130 \
              -X POST "https://superyou-voice-agent.gateway-worker-ai.workers.dev/api/admin/graph-smoke?full=true" \
              -H "x-admin-token: $PLIVO_AUTH_TOKEN" \
              | jq -e '.ok == true and .stopped == true and .full == true and (.graph_id | length > 0)'; then
              full_graph_ready=true
              break
            fi
            echo "retrying production full TEN graph smoke ($attempt/3)"
          done
          test "$full_graph_ready" = true
