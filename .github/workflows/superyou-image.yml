name: Build SuperYou voice agent image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (native amd64)
        uses: docker/build-push-action@v6
        with:
          context: ai_agents
          file: ai_agents/agents/examples/voice-assistant-sip-plivo/Dockerfile.cloudflare
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/superyou-voice-agent:latest
            ghcr.io/${{ github.repository_owner }}/superyou-voice-agent:${{ github.sha }}
